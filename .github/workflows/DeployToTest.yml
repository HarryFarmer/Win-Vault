# .github/workflows/deploy-to-test.yml
# Builds a MANAGED solution from the source in main and imports it into TEST.
# The repo - not the Dev environment - is what gets deployed.

name: 2 - Deploy to Test

on:
  push:
    branches: [main]
    paths: ["src/**"]           # only when solution source actually changed
  workflow_dispatch:            # or run manually

env:
  SOLUTION_NAME: ${{ vars.SOLUTION_NAME }}
  SOLUTION_FOLDER: src/${{ vars.SOLUTION_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test           # GitHub Environment - lets you add an approval gate later
    steps:
      - uses: actions/checkout@v4

      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      # Rebuild the zip from the XML in the repo
      - name: Pack managed solution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: ${{ env.SOLUTION_FOLDER }}
          solution-file: out/${{ env.SOLUTION_NAME }}_managed.zip
          solution-type: Managed

      - name: Who am I (Test)
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ vars.TEST_URL }}
          app-id: ${{ vars.PP_APP_ID }}
          client-secret: ${{ secrets.POWERPLATFORMSPN }}
          tenant-id: ${{ vars.PP_TENANT_ID }}

      - name: Import into Test
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.TEST_URL }}
          app-id: ${{ vars.PP_APP_ID }}
          client-secret: ${{ secrets.POWERPLATFORMSPN }}
          tenant-id: ${{ vars.PP_TENANT_ID }}
          solution-file: out/${{ env.SOLUTION_NAME }}_managed.zip
          force-overwrite: true
          publish-changes: true
          run-asynchronously: true   # avoids timeouts on bigger imports

      # Keep the built zip so you can download exactly what was deployed
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SOLUTION_NAME }}-managed
          path: out/${{ env.SOLUTION_NAME }}_managed.zip
